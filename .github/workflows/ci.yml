name: ci

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: the workflow can read the code and nothing else.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # Every action is pinned to a full commit SHA; Dependabot proposes updates.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
      # The generated Python and Go services run their own tests inside this suite.
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26"
          cache: false
      - run: make ci
      - name: Form-to-passing-tests timing (job summary)
        run: make measure | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Known-vulnerability audit
        run: make audit

  # Build and run the container image of every generated service, then probe its health endpoint.
  generated-images:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      matrix:
        language: [node, python, go]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
      - run: npm ci && npm run build
      - name: Scaffold a ${{ matrix.language }} service with a database
        run: >
          node dist/src/cli.js scaffold --template templates/service --out generated
          --set name=demo-api --set "description=Demo service built in CI from the template."
          --set owner=group:platform --set language=${{ matrix.language }} --set database=true
          --set "repoUrl=github.com?owner=acme&repo=demo-api"
      - name: Build the generated image
        run: docker build -t demo-api:ci generated
      - name: Run it and probe /healthz and /readyz
        run: |
          docker run -d --name demo -p 8080:8080 -e DATABASE_URL=postgres://db/app demo-api:ci
          for i in $(seq 1 30); do curl -fsS localhost:8080/healthz && break; sleep 1; done
          curl -fsS localhost:8080/readyz
          test "$(docker inspect -f '{{.Config.User}}' demo-api:ci)" != ""
          docker rm -f demo
